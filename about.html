<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>About Us</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to bottom right, #1a73e8, #003366);
            color: #f8f9fa;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-in-out;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: slideIn 1.5s ease-in-out;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn-primary {
            background-color: #0066cc;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #004d99;
        }

        .nav {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }

        .nav-link {
            color: #f0f0f0;
            font-weight: bold;
            margin: 0 10px;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            height: 60px;
            width: auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <img src="https://companieslogo.com/img/orig/SBK.JO-ad034386.png?t=1720244493" alt="Logo" class="logo">
    
    <!-- Navigation -->
    <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About Us</a>
        <a class="nav-link" href="contact.html">Contact Us</a>
    </nav>

    <!-- Card Content -->
    <div class="card">
        <h1>About Us</h1>
        <p>We are dedicated to building advanced multi-modal image retrieval systems for seamless user experiences. Our goal is to innovate and provide solutions that combine AI, machine learning, and modern technologies.</p>
        <a href="index.html" class="btn btn-primary">Back to Home</a>
    </div>
</body>
</html>
