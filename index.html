<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Multi-Modal Image Retrieval System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-image: url('https://eagle.co.ug/wp-content/uploads/2022/10/STANDARD-BANK.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f0f0f0;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
            animation: fadeIn 2s ease-in-out;
        }

        .nav {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .nav-link {
            color: #f0f0f0;
            font-weight: bold;
            margin: 0 10px;
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            text-decoration: underline;
            color: #00509e;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: slideIn 1s ease-out;
        }

        .search-container {
            position: relative;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 1.5s ease-in-out;
        }

        .form-control {
            border-radius: 25px;
            border: 1px solid #003366;
            padding: 15px 50px 15px 15px;
            font-size: 1.2rem;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #00509e;
        }

        .mic-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            font-size: 1.5rem;
            cursor: pointer;
            color: #003366;
            transition: color 0.3s ease;
        }

        .mic-icon:hover {
            color: #00509e;
        }

        .btn-primary {
            background-color: #003366;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            padding: 10px 20px;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #00509e;
        }

        #results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            animation: fadeInUp 2s ease-in-out;
        }

        #results img {
            border-radius: 10px;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 30%;
            height: auto;
            opacity: 0;
            animation: fadeInImage 1s ease-in-out forwards;
        }

        /* Animations */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes slideIn {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInImage {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About Us</a>
        <a class="nav-link" href="contact.html">Contact Us</a>
    </nav>

    <h1>Multi-Modal Image Retrieval System</h1>
    
    <div class="search-container">
        <input type="text" id="query" class="form-control mb-3" placeholder="Enter your query here">
        <i class="mic-icon bi bi-mic-fill" onclick="startVoiceRecognition()"></i>
    </div>
   <!----> 
    <a href="test_data_v2" class="btn btn-primary">Search</a>

    <div id="results" class="row mt-3"></div>

    
    <script>
        async function searchImages() {
            const query = document.getElementById('query').value;
            if (!query.trim()) {
                alert("Please enter a query!");
                return;
            }
        
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
        
                if (!response.ok) {
                    alert("Error fetching results!");
                    return;
                }
        
                const data = await response.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';  // Clear previous results
        
                data.results.forEach(relativePath => {
                    const img = document.createElement('img');
                    // Construct the correct path to the image
                    img.src = `http://127.0.0.1:5500/test_data_v2/${relativePath.split('/').pop()}`;
                    img.className = 'col-md-4';
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                    resultsDiv.appendChild(img);
                });
            } catch (error) {
                console.error("Error:", error);
                alert("An unexpected error occurred. Please try again.");
            }
        }
        
        
        
    </script>

    <script>
        function startVoiceRecognition() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => console.log("Voice recognition started. Speak now...");
            recognition.onspeechend = () => recognition.stop();
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('query').value = transcript;
            };
            recognition.onerror = (event) => alert("Speech recognition error: " + event.error);
            recognition.start();
        }

        async function searchImages() {
            const query = document.getElementById('query').value;
            if (!query.trim()) {
                alert("Please enter a query!");
                return;
            }
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });

            if (!response.ok) {
                alert("Error fetching results!");
                return;
            }

            const data = await response.json();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            data.results.forEach(relativePath => {
                // Construct the full URL for the image
                const img = document.createElement('img');
                img.src = `/test_data_v2/${relativePath.split('/').pop()}`;
                img.className = 'col-md-4';
                img.style.maxWidth = '100%';
                img.style.height = 'auto';
                resultsDiv.appendChild(img);
            });
        }
    </script>
</body>
</html>
